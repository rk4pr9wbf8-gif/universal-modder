l_english:
 APL_the_snallygaster_roosts:0 "The Snallygaster Roosts"
 APL_the_snallygaster_roosts_desc:0 "Half dragon, half bird, with a single eye and a taste for blood. It has hunted the Maryland hills since the 1700s. Give it an air wing to fly with."
 APL_hellhound_kennels:0 "Hellhound Kennels"
 APL_hellhound_kennels_desc:0 "Black dogs with red eyes have always run the Appalachian roads at night. Breed them."
 APL_the_grafton_horror:0 "The Grafton Horror"
 APL_the_grafton_horror_desc:0 "Nine feet tall, white and headless, it walks the river road at Grafton. Teach it to hold a line."
 APL_tailypo_scouts:0 "Tailypo Scouts"
 APL_tailypo_scouts_desc:0 "Small, quick and patient, it waits under the floorboards for its tail. Let it wait under enemy trenches."
 APL_the_night_doctrine:0 "The Night Doctrine"
 APL_the_night_doctrine_desc:0 "We fight only after sundown, when everything in the hollows is on our side."
 APL_the_endless_hunt:0 "The Endless Hunt"
 APL_the_endless_hunt_desc:0 "Every horror in the hollows, bound and marching. The hunt never ends."
 APL_the_thirteen_chairs:0 "The Thirteen Chairs"
 APL_the_thirteen_chairs_desc:0 "The Coven sits in judgement. The Assembly may advise, from the back of the church."
 APL_the_miners_charter:0 "The Miners' Charter"
 APL_the_miners_charter_desc:0 "Eight-hour shifts, a company doctor, a vote. The Coven signs, through its teeth."
 APL_silence_the_union_halls:0 "Silence the Union Halls"
 APL_silence_the_union_halls_desc:0 "The fog visits the union halls at night. The meetings get smaller."
 APL_rule_by_omen:0 "Rule by Omen"
 APL_rule_by_omen_desc:0 "Policy is decided by the flight of birds and the entrails of goats. It is wrong less often than Congress was."
 APL_the_black_throne:0 "The Black Throne"
 APL_the_black_throne_desc:0 "Silas Blackwood no longer sits in a chair. He sits on something carved from the mountain itself."
 APL_county_elections:0 "County Elections"
 APL_county_elections_desc:0 "Sheriffs and judges, elected again by the people of the hollows."
 APL_schools_in_the_hollows:0 "Schools in the Hollows"
 APL_schools_in_the_hollows_desc:0 "Every child learns to read, to count, and which words never to say after dark."
 APL_the_peoples_assembly_focus:0 "The People's Assembly"
 APL_the_peoples_assembly_focus_desc:0 "The Assembly governs; the Coven keeps the Veil. An uneasy peace, but a peace."
 APL_a_nation_of_two_worlds:0 "A Nation of Two Worlds"
 APL_a_nation_of_two_worlds_desc:0 "The living and the other. The Commonwealth is home to both, and both will defend it."
 APL_the_hollow_treasury:0 "The Hollow Treasury"
 APL_the_hollow_treasury_desc:0 "Every coin, note and IOU in the Commonwealth, gathered in a vault beneath the Hollow Creek church."
 APL_moonshine_cartels:0 "Moonshine Cartels"
 APL_moonshine_cartels_desc:0 "Organise the stills into cartels. The runners carry jars east and come back with dollars."
 APL_the_charm_trade:0 "The Charm Trade"
 APL_the_charm_trade_desc:0 "Every soldier in the world wants a charm that works. Ours do."
 APL_company_towns_reborn:0 "Company Towns Reborn"
 APL_company_towns_reborn_desc:0 "The old coal-company towns, reopened under the Commonwealth's name and the Coven's wards."
 APL_the_coal_road:0 "The Coal Road"
 APL_the_coal_road_desc:0 "A paved road from Harlan to Charleston. The trucks drive it with their headlights off."
 APL_an_economy_of_bone:0 "An Economy of Bone"
 APL_an_economy_of_bone_desc:0 "Coal, charms, corn liquor and fear. It is not an economy any professor would recognise, but it works."
 APL_open_the_black_library:0 "Open the Black Library"
 APL_open_the_black_library_desc:0 "Under the Hollow Creek church there is a library that was old when the Cherokee came. Unlock its doors."
 APL_the_scholars_of_hollow_creek:0 "The Scholars of Hollow Creek"
 APL_the_scholars_of_hollow_creek_desc:0 "Thirteen scholars who read by candlelight and never leave the library. They are always hungry."
 APL_bone_and_vacuum_tubes:0 "Bone and Vacuum Tubes"
 APL_bone_and_vacuum_tubes_desc:0 "Radios built from bone and copper pick up stations that have never broadcast."
 APL_oak_ridge_defectors:0 "Oak Ridge Defectors"
 APL_oak_ridge_defectors_desc:0 "Physicists from Oak Ridge walk into the fog with their notebooks. Some of them want to come."
 APL_the_mothman_computer:0 "The Mothman Computer"
 APL_the_mothman_computer_desc:0 "A machine of vacuum tubes and moth wings that predicts the future. It is right about half the time."
 APL_atomic_witchcraft:0 "Atomic Witchcraft"
 APL_atomic_witchcraft_desc:0 "Uranium and the old words. Dr. Varner says the two were always meant to meet."
 APL_the_black_sun_reactor:0 "The Black Sun Reactor"
 APL_the_black_sun_reactor_desc:0 "A reactor in the deepest mine in Harlan County, cooled by water from a spring that runs uphill."
 APL_the_unwritten_science:0 "The Unwritten Science"
 APL_the_unwritten_science_desc:0 "Physics, alchemy and the thing beneath the mountain, finally understood as one subject."
 APL_the_world_beyond_the_fog:0 "The World Beyond the Fog"
 APL_the_world_beyond_the_fog_desc:0 "Two empires are dividing the world. Both have noticed the fog. It is time to decide what we say to them."
 APL_whispers_to_moscow:0 "Whispers to Moscow"
 APL_whispers_to_moscow_desc:0 "The Soviets want to know what the fog is. Tell them it's a weapon against America. It isn't a lie."
 APL_the_washington_back_channel:0 "The Washington Back Channel"
 APL_the_washington_back_channel_desc:0 "A quiet line to the State Department. Let them think we can be bargained with."
 APL_neither_east_nor_west:0 "Neither East nor West"
 APL_neither_east_nor_west_desc:0 "The hollows answer to no empire. Let the world's small nations look to the fog instead."
 APL_red_hollows:0 "Red Hollows"
 APL_red_hollows_desc:0 "Soviet advisers in the coal camps. They brought rifles, and they brought questions about the charms."
 APL_join_the_eastern_bloc:0 "Join the Eastern Bloc"
 APL_join_the_eastern_bloc_desc:0 "A seat at Stalin's table. He doesn't like what we are, but he likes where we are."
 APL_the_quiet_treaty:0 "The Quiet Treaty"
 APL_the_quiet_treaty_desc:0 "No American soldier enters the fog; nothing comes out of it. Signed in a diner in Bluefield."
 APL_dollars_for_the_dark:0 "Dollars for the Dark"
 APL_dollars_for_the_dark_desc:0 "Washington pays us to keep our monsters home. We cash every cheque."
 APL_lead_the_unaligned:0 "Lead the Unaligned"
 APL_lead_the_unaligned_desc:0 "The Midnight Pact is no longer a coven's whim. It's the third bloc."
 APL_the_mothman_satellite:0 "The Mothman Satellite"
 APL_the_mothman_satellite_desc:0 "The Americans and Soviets race to put something in orbit. We already have something up there. It looks back."
 APL_duck_and_cover:0 "Duck and Cover"
 APL_duck_and_cover_desc:0 "The rest of the world hides under school desks. Our children hide under the old stones, which work better."
 APL_the_atomic_rite:0 "The Atomic Rite"
 APL_the_atomic_rite_desc:0 "An atomic test on the summit of Black Mountain, timed to the blood moon. The flash is seen in Washington."
 APL_proxy_wars_of_the_night:0 "Proxy Wars of the Night"
 APL_proxy_wars_of_the_night_desc:0 "Wherever the blocs fight, in Korea or Malaya or Greece, something from the hollows fights too."
 APL_the_long_twilight:0 "The Long Twilight"
 APL_the_long_twilight_desc:0 "The Cold War may last forever. So will we."
 APL_snallygaster_wings_spirit:0 "Snallygaster Wings"
 APL_snallygaster_wings_spirit_desc:0 "Our pilots fly with something huge and eyeless above them."
 APL_night_doctrine_spirit:0 "The Night Doctrine"
 APL_night_doctrine_spirit_desc:0 "Our army fights at night, and the night fights with it."
 APL_rule_by_omen_spirit:0 "Rule by Omen"
 APL_rule_by_omen_spirit_desc:0 "The Thirteen read the signs, and the Commonwealth obeys."
 APL_hollow_schools_spirit:0 "Schools in the Hollows"
 APL_hollow_schools_spirit_desc:0 "A literate Commonwealth, taught by teachers who carry charms."
 APL_two_worlds_spirit:0 "A Nation of Two Worlds"
 APL_two_worlds_spirit_desc:0 "The living and the dead of the hollows stand together."
 APL_economy_of_bone_spirit:0 "An Economy of Bone"
 APL_economy_of_bone_spirit_desc:0 "The Commonwealth runs on coal, charms and fear."
 APL_non_aligned_spirit:0 "Neither East nor West"
 APL_non_aligned_spirit_desc:0 "Appalachia belongs to no bloc."
 APL_duck_and_cover_spirit:0 "Duck and Cover"
 APL_duck_and_cover_spirit_desc:0 "The hollows are ready for the end of the world."
 APL_long_twilight_spirit:0 "The Long Twilight"
 APL_long_twilight_spirit_desc:0 "Appalachia endures, between the blocs and beyond them."
 APL_ft_scrip_100_tt:0 "The Hollow Treasury gains §G100§! Scrip."
 APL_ft_scrip_200_tt:0 "The Hollow Treasury gains §G200§! Scrip."
 APL_ft_scrip_300_tt:0 "The Hollow Treasury gains §G300§! Scrip."
 APL_ft_scrip_400_tt:0 "The Hollow Treasury gains §G400§! Scrip."
 APL_ft_income_10_tt:0 "The Hollow Treasury earns §G10§! more Scrip each month."
 APL_ft_income_15_tt:0 "The Hollow Treasury earns §G15§! more Scrip each month."
 APL_ft_income_20_tt:0 "The Hollow Treasury earns §G20§! more Scrip each month."
 APL_ft_lib_research_tt:0 "§YThe Black Library§!: research speed §G+5%§!."
 APL_ft_lib_defence_tt:0 "§YThe Black Library§!: division defence §G+5%§!."
 APL_ft_lib_org_tt:0 "§YThe Black Library§!: division organisation §G+5%§!."
 APL_ft_lib_both_tt:0 "§YThe Black Library§!: research speed and factory output §G+5%§!."
 APL_ft_lib_capstone_tt:0 "§YThe Black Library§!: research speed §G+10%§!, stability §G+5%§!."
 APL_ft_veil_cap_tt:0 "§YThe Veil§! can grow §G50§! stronger."
 APL_ft_all_cryptids_tt:0 "Unlocks §Yevery§! cryptid battalion and §YBlack Furnace Charms§!."
 APL_ft_moscow_tt:0 "§YThe Soviet Union§! will be asked for rifles and money."
 APL_ft_washington_tt:0 "§YThe United States§! will be offered a quiet arrangement."
 appalachia_cw.1.t:0 "A Message from the Fog"
 appalachia_cw.1.d:0 "A letter arrived at the Soviet embassy in Washington, written in Russian on paper that smells of coal smoke. It offers an alliance against America from “the Veiled Commonwealth of Appalachia”, and it describes, accurately, what Comrade Stalin dreamed last Tuesday.\n\nThe Politburo is divided."
 appalachia_cw.1.a:0 "Send rifles and roubles. Anything that hurts America helps us."
 appalachia_cw.1.a.tt:0 "§YAppalachia§! receives 3,000 Soviet rifles and 150 Hollow Scrip."
 appalachia_cw.1.b:0 "We do not deal with witches."
 appalachia_cw.2.t:0 "A Voice on the Back Channel"
 appalachia_cw.2.d:0 "A man in a fine black suit visited the State Department this morning. He came from inside the fog. He offers a quiet arrangement: the Commonwealth stays inside its mountains, and Project Lantern goes dark for a year. Nobody saw him leave the building."
 appalachia_cw.2.a:0 "Agree. Quietly."
 appalachia_cw.2.a.tt:0 "§YProject Lantern§! is suspended for a year, and §YAppalachia§! receives 150 Scrip."
 appalachia_cw.2.b:0 "The United States does not negotiate with ghosts."
 appalachia_cw.3.t:0 "Something in Orbit"
 appalachia_cw.3.d:0 "Our scholars aimed the bone radio at the sky and heard a signal that matches no American or Soviet satellite. It beeps in the rhythm of a heartbeat. Every night it passes directly over Point Pleasant."
 appalachia_cw.3.a:0 "It's watching over us."
 appalachia_cw.4.t:0 "A Flash over Black Mountain"
 appalachia_cw.4.d:0 "Seismographs from Pasadena to Semipalatinsk recorded it: an atomic detonation on the summit of Black Mountain, Kentucky, at the exact moment of the lunar eclipse. Air samples show something no reactor makes. Our scientists refuse to say what."
 appalachia_cw.4.a:0 "Add it to the list of things we don't talk about."
