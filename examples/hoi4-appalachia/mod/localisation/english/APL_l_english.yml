l_english:
 APL:0 "Appalachia"
 APL_DEF:0 "the Veiled Commonwealth of Appalachia"
 APL_ADJ:0 "Appalachian"
 APL_neutrality:0 "Veiled Commonwealth"
 APL_neutrality_DEF:0 "the Veiled Commonwealth of Appalachia"
 APL_neutrality_ADJ:0 "Appalachian"
 APL_democratic:0 "Appalachian Republic"
 APL_democratic_DEF:0 "the Appalachian Republic"
 APL_democratic_ADJ:0 "Appalachian"
 APL_fascism:0 "Hollow Dominion"
 APL_fascism_DEF:0 "the Hollow Dominion"
 APL_fascism_ADJ:0 "Appalachian"
 APL_communism:0 "Appalachian Miners' Commune"
 APL_communism_DEF:0 "the Appalachian Miners' Commune"
 APL_communism_ADJ:0 "Appalachian"
 APL_neutrality_party:0 "The Coven"
 APL_neutrality_party_long:0 "The Coven of the Hollows"
 APL_democratic_party:0 "Ridge Assembly"
 APL_democratic_party_long:0 "The Free Assembly of the Ridges"
 APL_fascism_party:0 "Black Mountain Lodge"
 APL_fascism_party_long:0 "The Lodge of the Black Mountain"
 APL_communism_party:0 "UMW Underground"
 APL_communism_party_long:0 "The United Mine Workers' Underground"
 APL_silas_blackwood:0 "Silas Blackwood"
 APL_maw_hettie_crane:0 "Maw Hettie Crane"
 APL_jeremiah_coalbrook:0 "Jeremiah Coalbrook"
 APL_the_pale_lieutenant:0 "The Pale Lieutenant"
 APL_keeper_of_the_veil:0 "Keeper of the Veil"
 APL_lord_of_the_hollows:0 "Lord of the Hollows"
 APL_hollow_matriarch:0 "Granny Witch of Hollow Creek"
 APL_the_veil:0 "The Veil"
 APL_the_veil_desc:0 "On the night of the Severance the Coven spoke words older than the mountains, and a wall of fog rose along every ridge from the Blue Ridge to the Cumberland. Roads into Appalachia now lead back out again. Soldiers who march into the fog come home years older, or not at all.\n\n§YWhile the Veil stands, any war against Appalachia ends in a white peace within days, and every attack weakens the Veil.§!"
 APL_blood_price:0 "The Blood Price"
 APL_blood_price_desc:0 "The Veil was not free. The Coven paid for it in the old currency, and it is still paying. Babies are born quiet. Miners walk into the shafts and are not missed until supper. Something has to keep feeding the fog."
 APL_blood_price_eased:0 "The Blood Price, Eased"
 APL_blood_price_eased_desc:0 "The granny witches have taken up their poultices and their root-work. The Veil still drinks, but now it sips."
 APL_hollow_folk:0 "Hollow Folk"
 APL_hollow_folk_desc:0 "Mountain people have always known to leave a saucer of milk on the step and never to whistle after dark. Now everyone else knows why. They are hard, suspicious, and very, very loyal."
 APL_hollow_mist:0 "The Hollow Mist"
 APL_hollow_mist_desc:0 "Teach the fog to follow our soldiers down from the ridges."
 APL_the_eternal_veil:0 "The Eternal Veil"
 APL_the_eternal_veil_desc:0 "The Veil will never fall. The Coven has bound it to the bones of the mountains themselves. The price is that Appalachia can never leave either."
 APL_veil_parted:0 "The Veil Parted"
 APL_veil_parted_desc:0 "We have lowered the Veil ourselves. Let them see what lives in the hollows. Let them see it coming down the mountain toward them."
 APL_children_of_the_night:0 "Children of the Night"
 APL_children_of_the_night_desc:0 "Our army fights in the dark now. The enemy will learn to fear sundown."
 APL_the_wild_hunt:0 "The Wild Hunt"
 APL_the_wild_hunt_desc:0 "Loose every horror in the hollows at once."
 APL_the_matriarch:0 "The Matriarch"
 APL_the_matriarch_desc:0 "Let Maw Hettie lead the Coven. She will keep the Commonwealth alive, and human, for as long as that is possible."
 APL_old_scratch_bargain:0 "The Bargain with Old Scratch"
 APL_old_scratch_bargain_desc:0 "A man in a fine black suit came to the crossroads at midnight with a fiddle and a contract. The factories have never run faster. Nobody asks where the night shift goes."
 APL_moonshine_economy:0 "The Moonshine Economy"
 APL_moonshine_economy_desc:0 "Legalise every still in the Commonwealth, then tax them."
 APL_the_black_furnace:0 "The Black Furnace"
 APL_the_black_furnace_desc:0 "There is a fire at the bottom of the deepest mine in Harlan County. Build a foundry around it."
 APL_veil_shattered:0 "The Veil Shattered"
 APL_veil_shattered_desc:0 "The fog is gone. For the first time since the Severance, the outside world can see in. Our people are terrified, and angry."
 APL_blood_moon:0 "Rite of the Blood Moon"
 APL_blood_moon_desc:0 "The moon rose red over every battlefield this month. Our soldiers do not tire and do not feel their wounds until morning."
 APL_mist_rite:0 "The Hollow Mist Rite"
 APL_mist_rite_desc:0 "The Coven has called the mist down onto the front. Enemy shells fall into the fog and do not land."
 APL_black_mountain_curse:0 "Curse of the Black Mountain"
 APL_black_mountain_curse_desc:0 "A curse was laid on this nation from the summit of Black Mountain. Milk sours, dogs howl at nothing, and generals wake from dreams they will not describe."
 APL_fog_madness:0 "Fog Madness"
 APL_fog_madness_desc:0 "Survivors who stumbled back out of the Appalachian fog speak in tongues and draw the same symbol over and over. The newspapers have started printing it."
 APL_bell_witch_torment:0 "The Bell Witch's Torment"
 APL_bell_witch_torment_desc:0 "Something has taken up residence in the halls of government. It knocks inside the walls, pulls the covers off sleeping senators and sings hymns backwards in the voice of the President's mother."
 APL_the_severance:0 "The Severance"
 APL_the_severance_desc:0 "We are no longer part of the United States. We are no longer part of the world. Let us decide what we are."
 APL_feed_the_veil:0 "Feed the Veil"
 APL_feed_the_veil_desc:0 "The fog thins at the edges. The Coven says it is hungry. The Coven is never wrong about hunger."
 APL_wardstones:0 "Raise the Wardstones"
 APL_wardstones_desc:0 "Standing stones carved with the old signs, set in every gap and pass. They hold the Veil steady and make it slower to fade."
 APL_seal_the_passes:0 "Seal the Passes"
 APL_seal_the_passes_desc:0 "Cumberland Gap, the New River Gorge, every road and rail line: sealed with iron, salt and blood."
 APL_whispers_in_the_fog:0 "Whispers in the Fog"
 APL_whispers_in_the_fog_desc:0 "Let the fog drift east on the wind. Let Washington hear what our mountains are saying."
 APL_eternal_veil:0 "The Eternal Veil"
 APL_eternal_veil_desc:0 "Bind the Veil to the mountains forever. Appalachia will be a world of its own, untouchable and unending."
 APL_part_the_veil:0 "Part the Veil"
 APL_part_the_veil_desc:0 "Hiding was never the plan. Lower the Veil and let the hollows spill out into the lowlands."
 APL_beyond_the_ridges:0 "Beyond the Ridges"
 APL_beyond_the_ridges_desc:0 "The old Appalachia was bigger than three states. The mountains remember where they end, and it is not where the surveyors drew the lines."
 APL_the_night_march:0 "The Night March"
 APL_the_night_march_desc:0 "We march at moonrise. Bring the charms."
 APL_the_mountains_remember:0 "The Mountains Remember"
 APL_the_mountains_remember_desc:0 "The land we have taken was always ours. The dead under it say so."
 APL_a_shadow_over_america:0 "A Shadow over America"
 APL_a_shadow_over_america_desc:0 "From the Atlantic to the Mississippi, every porch light will be left on all night. It will not help them."
 APL_call_of_the_hollows:0 "Call of the Hollows"
 APL_call_of_the_hollows_desc:0 "Go into the hollows with a lantern and a binding charm, and call. Something will answer."
 APL_the_mothman_compact:0 "The Mothman Compact"
 APL_the_mothman_compact_desc:0 "It was seen on the Silver Bridge before it fell. It sees what is coming. Now it will tell us."
 APL_wake_the_woodboogers:0 "Wake the Woodboogers"
 APL_wake_the_woodboogers_desc:0 "Eight feet tall, covered in hair, and they have been watching from the treeline for three hundred years. Time to give them something to do."
 APL_binding_charm_forges:0 "Binding Charm Forges"
 APL_binding_charm_forges_desc:0 "Bone, nails, hair, a drop of blood, red flannel. Ten thousand of them a month, sewn by lamplight."
 APL_sheepsquatch_herds:0 "The Sheepsquatch Herds"
 APL_sheepsquatch_herds_desc:0 "White wool, ram's horns and the stink of sulphur. They run down anything that flees."
 APL_the_flatwoods_visitors:0 "The Flatwoods Visitors"
 APL_the_flatwoods_visitors_desc:0 "In 1952 something landed on a hill in Braxton County. It is still there. It has agreed to help."
 APL_convene_the_coven:0 "Convene the Coven"
 APL_convene_the_coven_desc:0 "Thirteen chairs around a table in a church that is not on any map. Twelve are filled. The thirteenth is never spoken of."
 APL_granny_witch_healers:0 "The Granny Witches"
 APL_granny_witch_healers_desc:0 "Mountain healers who never needed a doctor's licence. Their remedies work. Do not ask what is in them."
 APL_the_bell_witch:0 "The Bell Witch"
 APL_the_bell_witch_desc:0 "She tormented a Tennessee family for four years and killed its father. Washington is a much bigger family."
 APL_the_dark_sermons:0 "The Dark Sermons"
 APL_the_dark_sermons_desc:0 "Snake-handlers and hellfire preachers, now preaching for the Coven. The congregations have never been fuller."
 APL_rites_of_the_black_mountain:0 "Rites of the Black Mountain"
 APL_rites_of_the_black_mountain_desc:0 "On the highest peak in Kentucky there is a ring of stones that predates the Cherokee. Learn its rites."
 APL_bargain_with_old_scratch:0 "Bargain with Old Scratch"
 APL_bargain_with_old_scratch_desc:0 "The Devil went down to Georgia. He's been in Kentucky a while now too, waiting at the crossroads with a contract."
 APL_the_hollow_crown:0 "The Hollow Crown"
 APL_the_hollow_crown_desc:0 "Silas Blackwood is no longer merely Keeper of the Veil. He is Lord of the Hollows."
 APL_coal_and_bone:0 "Coal and Bone"
 APL_coal_and_bone_desc:0 "The mines never stopped. The miners stopped going home."
 APL_the_deep_mines:0 "The Deep Mines"
 APL_the_deep_mines_desc:0 "Dig deeper than any company ever dared. There are seams down there that are warm to the touch."
 APL_bone_foundries:0 "Bone Foundries"
 APL_bone_foundries_desc:0 "Arms factories on the old company-town sites. The ash from the chimneys is white."
 APL_valley_of_dams:0 "Valley of Dams"
 APL_valley_of_dams_desc:0 "Finish the dams on the Tennessee. Drown the old towns; the dead in them do not mind the water."
 APL_the_hollow_laboratories:0 "The Hollow Laboratories"
 APL_the_hollow_laboratories_desc:0 "Physicists from Oak Ridge and witches from Hollow Creek, working together under one roof. Neither side will describe the results."
 APL_hollow_revenants:0 "Hollow Revenants"
 APL_hollow_revenants_desc:0 "Raw Head and Bloody Bones calls the coal-camp dead back up the shaft. They are slow and cheap, they eat little, and they do not break."
 APL_woodbooger_brutes:0 "Woodbooger Brutes"
 APL_woodbooger_brutes_desc:0 "Eight-foot hair-covered brutes from the Virginia ridges. Devastating in forest and mountain, and hungry everywhere."
 APL_sheepsquatch_packs:0 "Sheepsquatch Packs"
 APL_sheepsquatch_packs_desc:0 "Fast, horned and wreathed in sulphur. Ideal for breakthroughs in hill and forest country."
 APL_mothman_flock:0 "Mothman Flock"
 APL_mothman_flock_desc:0 "Red eyes in the clouds above the division. The Mothman sees the battle before it begins."
 APL_flatwoods_sentinels:0 "Flatwoods Sentinels"
 APL_flatwoods_sentinels_desc:0 "The visitors from Braxton County hiss a sickening mist over enemy lines, and keep occupied towns very quiet."
 APL_granny_witches:0 "Granny Witches"
 APL_granny_witches_desc:0 "Poultices, root-work and the words that call a soul back into its body. Fewer of our wounded stay dead."
 APL_binding_charms:0 "Binding Charms"
 APL_binding_charms_desc:0 "Bone, iron nails, a lock of hair and a drop of the bearer's blood, sewn into a red flannel bag. Cryptids fight for whoever holds the charm."
 APL_binding_charms_1:0 "Red Flannel Charms"
 APL_binding_charms_1_short:0 "Flannel Charms"
 APL_binding_charms_1_desc:0 "Hand-sewn by the granny witches. They mostly hold."
 APL_binding_charms_2:0 "Black Furnace Charms"
 APL_binding_charms_2_short:0 "Furnace Charms"
 APL_binding_charms_2_desc:0 "Cast in iron from the Black Furnace. Nothing has broken one yet."
 APL_tech_hollow_revenants:0 "Hollow Revenants"
 APL_tech_hollow_revenants_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_tech_binding_charms:0 "Binding Charms"
 APL_tech_binding_charms_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_tech_binding_charms_2:0 "Black Furnace Charms"
 APL_tech_binding_charms_2_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_tech_mothman_flock:0 "Mothman Flock"
 APL_tech_mothman_flock_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_tech_woodbooger_brutes:0 "Woodbooger Brutes"
 APL_tech_woodbooger_brutes_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_tech_sheepsquatch_packs:0 "Sheepsquatch Packs"
 APL_tech_sheepsquatch_packs_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_tech_flatwoods_sentinels:0 "Flatwoods Sentinels"
 APL_tech_flatwoods_sentinels_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_tech_granny_witches:0 "Granny Witches"
 APL_tech_granny_witches_desc:0 "An occult working of the Coven, not a technology anyone outside the hollows could research."
 APL_rites_of_the_hollows:0 "Rites of the Hollows"
 APL_rites_of_the_hollows_desc:0 "The Veil holds at §Y[?APL_veil_strength|0]§! out of §Y[?APL_veil_cap|0]§!. It loses §R[?APL_veil_decay|1]§! every week, and §R10§! every time an enemy breaks upon it. At §R0§! it falls.\n\nWhile it stands, any war against us ends within days. The Coven can feed it, at a price."
 USA_project_lantern:0 "Project Lantern"
 USA_project_lantern_desc:0 "A classified joint effort of the Army, the Atomic Energy Commission and the Catholic Church to understand, and break, the barrier around Appalachia.\n\nThe barrier currently measures §Y[?APL.APL_veil_strength|0]§! units on the Lantern scale."
 APL_blood_tithe:0 "The Blood Tithe"
 APL_blood_tithe_desc:0 "Volunteers walk up to the ridge at dusk. The fog grows thicker by morning."
 APL_bury_the_bones:0 "Bury the Bones at the Crossroads"
 APL_bury_the_bones_desc:0 "Bones from the old coal-camp cemeteries, reburied at every crossroads on the border."
 APL_rite_of_the_blood_moon:0 "Rite of the Blood Moon"
 APL_rite_of_the_blood_moon_desc:0 "A red moon over every battlefield for sixty nights. It must be paid for in blood."
 APL_call_the_hollow_mist:0 "Call the Hollow Mist"
 APL_call_the_hollow_mist_desc:0 "Bring the fog down onto the front line, where it can hide our soldiers."
 APL_raise_the_coal_camp_dead:0 "Raise the Coal-Camp Dead"
 APL_raise_the_coal_camp_dead_desc:0 "Raw Head and Bloody Bones walks through the company towns, and the dead get up to follow him. The living do not sleep well afterwards."
 APL_curse_of_the_black_mountain:0 "Curse of the Black Mountain on [FROM.GetName]"
 APL_curse_of_the_black_mountain_desc:0 "Lay a curse on an enemy nation from the summit of Black Mountain."
 USA_lantern_survey:0 "Lantern Survey Expedition"
 USA_lantern_survey_desc:0 "Surveyors, priests and physicists, sent to the edge of the fog with instruments nobody fully understands."
 USA_lantern_saturation:0 "Operation Floodlight"
 USA_lantern_saturation_desc:0 "Burn the treeline with phosphorus and floodlight the ridges for a month. Something in the fog does not like the light."
 APL_veil_plus_10_tt:0 "§YThe Veil§! strengthens by §G10§!."
 APL_veil_plus_15_tt:0 "§YThe Veil§! strengthens by §G15§!."
 APL_veil_plus_20_tt:0 "§YThe Veil§! strengthens by §G20§!."
 APL_veil_plus_25_tt:0 "§YThe Veil§! strengthens by §G25§!."
 APL_veil_plus_50_tt:0 "§YThe Veil§! strengthens by §G50§!."
 APL_wardstones_tt:0 "§YThe Veil§! now decays at half speed."
 APL_veil_cap_150_tt:0 "§YThe Veil§! can now reach a strength of §G150§!."
 APL_eternal_veil_tt:0 "§YThe Veil§! no longer decays on its own. Only enemies and their rituals can weaken it."
 APL_claim_frontier_tt:0 "Gain claims on the §Yfrontier states§! of the old Appalachia: Virginia, the Carolinas, Pennsylvania, Ohio, Maryland, Georgia and Alabama."
 APL_frontier_wargoal_tt:0 "Gain a war goal against the §YUnited States§! for the frontier states."
 APL_core_frontier_tt:0 "Every §Yfrontier state§! we own becomes a core state."
 APL_unlock_mothman_tt:0 "Unlocks the §YMothman Flock§! support company."
 APL_unlock_woodbooger_tt:0 "Unlocks the §YWoodbooger Brutes§! battalion."
 APL_unlock_sheepsquatch_tt:0 "Unlocks the §YSheepsquatch Packs§! battalion."
 APL_unlock_flatwoods_tt:0 "Unlocks the §YFlatwoods Sentinels§! support company."
 APL_unlock_granny_tt:0 "Unlocks the §YGranny Witches§! support company."
 APL_unlock_charms2_tt:0 "Unlocks §YBlack Furnace Charms§!."
 APL_unlock_rites_tt:0 "Unlocks the war rituals: §YRite of the Blood Moon§!, §YCall the Hollow Mist§! and the §YCurse of the Black Mountain§!."
 USA_lantern_minus_10_tt:0 "§YThe Appalachian barrier§! weakens by §G10§!."
 USA_lantern_minus_25_tt:0 "§YThe Appalachian barrier§! weakens by §G25§!."
 appalachia.1.t:0 "The Severance"
 appalachia.1.d:0 "On New Year's Eve, 1935, they say, Silas Blackwood stood on the summit of Spruce Knob at midnight, with the twelve of the Coven in a ring around him, and read aloud from a book bound in something that was not leather.\n\nBy dawn the fog had risen. It stands along every ridge from the Blue Ridge to the Cumberland Plateau, a grey wall a mile high that does not move with the wind. The radio carries only static and, sometimes, a woman humming. The roads into the mountains bend gently back on themselves. Federal marshals sent in at first light walked out at noon, white-haired, and could not say where they had been.\n\nIn the hollows, people are lighting their lamps and barring their doors. Something has been let out along with the fog. Something has been let in.\n\nAppalachia is free. It is the first morning of 1936."
 appalachia.1.a:0 "We are free. God help us."
 appalachia.2.t:0 "Fog over the Alleghenies"
 appalachia.2.d:0 "The reports from Charleston, Lexington and Knoxville stopped at the stroke of midnight on New Year's Eve. By the first morning of 1936 a wall of grey fog sat along the whole length of the Appalachian ridges, and every road into the mountains led out again.\n\nThe governors of West Virginia, Kentucky and Tennessee are not answering. A broadcast from inside the fog claims a new nation: the “Veiled Commonwealth of Appalachia”. It ends with a recording of church bells, played backwards.\n\nThe Joint Chiefs want to send a patrol in."
 appalachia.2.a:0 "Send a patrol in."
 appalachia.2.b:0 "Quarantine the region and wait."
 appalachia.11.t:0 "The Mountains Refuse You"
 appalachia.11.d:0 "Our columns marched into the fog at dawn. By nightfall the radio carried nothing but screaming, then hymns, then a long, wet silence.\n\nThe survivors came out of the treeline three days later, walking backwards. None of them will say what they saw. Several have not spoken at all.\n\nThe General Staff has quietly concluded that there is no war to fight. Not yet."
 appalachia.11.a:0 "God help them."
 appalachia.12.t:0 "They Broke Upon the Veil"
 appalachia.12.d:0 "The outsiders came with rifles and trucks. The fog took them as it takes everything.\n\nThe Coven reports that the Veil is weaker for the feeding, and hungrier."
 appalachia.12.a:0 "Let them try again."
 appalachia.20.t:0 "The Veil Thins"
 appalachia.20.d:0 "On the eastern ridges you can see the stars through the fog again. In Bluefield, a farmer swears he heard a car horn from the Virginia side.\n\nThe Coven says the Veil is starving. If it is not fed, it will fall, and everything outside will come in."
 appalachia.20.a:0 "Then we will feed it."
 appalachia.21.t:0 "The Veil Falls"
 appalachia.21.d:0 "It went out like a lamp. One moment the fog stood a mile high along every ridge, the next there was only morning sunlight and, beyond it, the lowlands, the highways and the watchtowers the outsiders had been building all this time.\n\nThe Coven is silent. In the hollows, the things that came with the fog are restless. They know the outsiders are coming. They are looking forward to it."
 appalachia.21.a:0 "Ready the charms."
 appalachia.22.t:0 "The Fog Lifts"
 appalachia.22.d:0 "For the first time since the Severance, our aircraft can see the Appalachian ridges. The fog is gone.\n\nReconnaissance photographs show the cities intact and the roads empty. They also show things that our analysts have asked not to be made to look at again.\n\nThe Joint Chiefs say the window is now."
 appalachia.22.a:0 "Reclaim the hollows!"
 appalachia.22.b:0 "Let the mountains keep them."
 appalachia.30.t:0 "Lights over Point Pleasant"
 appalachia.30.d:0 "For three nights running, red lights have circled the bridge at Point Pleasant. Witnesses describe something man-sized, grey and winged, with eyes that glow like coals in a stove.\n\nThe old-timers say it only comes before a disaster. The Coven says that is exactly why we should be listening to it."
 appalachia.30.a:0 "An omen. Ready the army."
 appalachia.30.b:0 "Close the bridge and say nothing."
 appalachia.31.t:0 "The Thing Beneath Hollow No. 9"
 appalachia.31.d:0 "The deep shafts broke through into a cavern that does not appear on any survey. The air coming up out of it is warm and smells of pennies. Three miners went down on ropes. The ropes came back up cut, and the cut ends were singed.\n\nSomething down there knocked back when the foreman knocked on the rock."
 appalachia.31.a:0 "Seal the shaft with concrete."
 appalachia.31.b:0 "Send the Coven down."
 appalachia.32.t:0 "It Was Not a Deer"
 appalachia.32.d:0 "The trucker on Route 60 thought it was a deer standing in the road. It had a deer's body, more or less. It stood up on its back legs as he passed, and it turned its head all the way around to watch him go.\n\nPeople are staying off the roads after dark."
 appalachia.32.a:0 "Tell everyone to stay inside at night."
 appalachia.32.b:0 "Send a hunting party."
 appalachia.33.t:0 "Maw Hettie's Warning"
 appalachia.33.d:0 "Maw Hettie Crane came down from Hollow Creek on foot, which she has not done in forty years, and sat in the Coven's thirteenth chair, which no one has ever done.\n\n“The fog is a mouth,” she said. “And you boys are feeding it your own children. Mind what you promise it.”\n\nThen she got up and walked home."
 appalachia.33.a:0 "Heed her."
 appalachia.33.b:0 "The Veil needs what it needs. Feed it."
 appalachia.34.t:0 "Tailypo"
 appalachia.34.d:0 "A trapper in Clay County cut the tail off some varmint that came in through the chimney, and ate it for supper. Every night since, something has scratched at his door asking, “Tailypo, tailypo, all I want is my tailypo.”\n\nHis three hounds have gone missing, one a night. The whole county is listening now."
 appalachia.34.a:0 "Give the thing back its tail."
 appalachia.34.b:0 "Keep the tail. Shoot whatever comes."
 appalachia.35.t:0 "The Visitors Come Down"
 appalachia.35.d:0 "The Flatwoods visitors came down from their hill for the first time since 1952: ten feet tall, faces glowing under hoods like an ace of spades, hissing a sweet, sickening mist.\n\nThey stood in formation in the square at Sutton until dawn. Then they turned toward the front line and began to walk."
 appalachia.35.a:0 "March with them."
 appalachia.40.t:0 "Lost in the Fog"
 appalachia.40.d:0 "A scout troop from Pittsburgh went camping too close to the Appalachian fog. Search parties found their tents pitched in a perfect circle, the fire still warm, and every boot lined up neatly outside, pointing toward the ridge.\n\nThe papers are asking what the government knows."
 appalachia.40.a:0 "Close every road within twenty miles of the fog."
 appalachia.41.t:0 "The Bell Witch Comes to Washington"
 appalachia.41.d:0 "It started with knocking inside the walls of the Capitol. Then the covers were pulled off sleeping senators. Then a voice in the West Wing began to sing hymns, beautifully and backwards, in the voice of the President's dead mother.\n\nThe Secret Service cannot find anyone. The exorcist they quietly brought in from Baltimore left the same night, without his car."
 appalachia.41.a:0 "This is not happening."
 appalachia.42.t:0 "A Curse from the Mountains"
 appalachia.42.d:0 "Across the nation, milk sours in the bottle, dogs howl at empty corners and generals wake from dreams they will not describe. On the summit of Black Mountain, the Appalachians have lit a fire that can be seen from three states away."
 appalachia.42.a:0 "It will pass. It has to pass."
 appalachia.50.t:0 "The Bargain Is Sealed"
 appalachia.50.d:0 "He came to the crossroads at midnight in a fine black suit, with a fiddle under one arm and a contract under the other. He played one tune, and every furnace in the Commonwealth caught fire on its own.\n\nSilas Blackwood signed. Nobody saw what with.\n\n“I'll be back to collect,” the stranger said, tipping his hat. “No hurry. I've got all the time in the world.”"
 appalachia.50.a:0 "What have we done?"
 appalachia.1.d_later:0 "It has been three years since New Year's Eve, 1935, when Silas Blackwood read from the book bound in something that was not leather, and the fog rose along every ridge from the Blue Ridge to the Cumberland.\n\nThree years of static on the radio. Three years of roads that bend back on themselves, of lamps lit at dusk and doors barred until dawn. The world outside has been arming for a war of its own. It has not forgotten us. It has only been busy.\n\nThe Veil still holds. The things in the hollows are still hungry."
 appalachia.2.d_later:0 "It has been three years since the fog rose over the Alleghenies and West Virginia, Kentucky and Tennessee vanished behind it. Every patrol sent in has come back wrong or not at all.\n\nThe so-called “Veiled Commonwealth of Appalachia” still broadcasts from inside the fog: church bells, played backwards. The Joint Chiefs want to try again."
 appalachia.2.a.tt:0 "§RThe patrol will not come back.§!"
 appalachia.11.a.tt:0 "§RThe war is over. The Veil has refused us.§!"
 appalachia.12.a.tt:0 "§YThe Veil§! weakened by §R10§! for every enemy it repelled."
