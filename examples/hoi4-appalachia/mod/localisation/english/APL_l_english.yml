 APL_Salafism_party:0 "Hollow Brethren"
 APL_Salafism_party_long:0 "The Brethren of the Hollows"
 APL_council_category:0 "The Council of Thirteen"
 APL_council_category_desc:0 "Steer the balance between the Coven, who keep the Veil, and the Mountain Assembly, who keep the mines running. Lean too far either way and the Commonwealth changes for good."
 APL_treasury_category:0 "The Hollow Treasury"
 APL_treasury_category_desc:0 "The Treasury holds §Y[?APL_treasury|0]§! Hollow Scrip.\nLast month: §G+[?APL_last_income|0]§! income, §R-[?APL_last_upkeep|0]§! army upkeep.\n\nIncome comes from every state we own, the Moonshine Economy, the Black Library and our Midnight Pact allies. Each division in the field costs 1 scrip a month in charms. Below zero, the Treasury goes into debt."
 APL_black_library_category:0 "The Black Library"
 APL_black_library_category_desc:0 "Under the Hollow Creek church is a library that was old when the Cherokee came. Paying the Coven's scholars in scrip unlocks its secrets, one tier at a time. Everything learned feeds the national spirit §YThe Black Library§!."
 APL_cold_war_category:0 "Cold War Intrigue"
 APL_cold_war_category_desc:0 "Washington wants us gone. Moscow wants us as a weapon. Neither understands what we are, and both will pay to find out."
 APL_cheat_menu:0 "Cheat Menu"
 APL_cheat_menu_desc:0 "Cheats for human players. Ironman and achievements are already off with mods enabled."
