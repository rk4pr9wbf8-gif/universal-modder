 APL_cheat_equipment:0 "Cheat: Fill the Armouries"
 APL_cheat_equipment_desc:0 "20,000 rifles, 2,000 support equipment, and 5,000 Binding Charms for Appalachia."
 APL_cheat_scrip:0 "Cheat: +1000 Hollow Scrip"
 APL_cheat_scrip_desc:0 "Cheat: +1000 Hollow Scrip"
 APL_cheat_dollars:0 "Cheat: +100 Money"
 APL_cheat_dollars_desc:0 "Adds to the base mod's own treasury."
 APL_cheat_restore_the_veil:0 "Cheat: Restore the Veil"
 APL_cheat_restore_the_veil_desc:0 "Raise the Veil again at full strength, even if it fell."
 APL_cheat_all_cryptids:0 "Cheat: Unlock Every Cryptid"
 APL_cheat_all_cryptids_desc:0 "Cheat: Unlock Every Cryptid"
 APL_cheat_instant_peace:0 "Cheat: Instant White Peace"
 APL_cheat_instant_peace_desc:0 "End every war you are in."
 APL_cheat_god_of_the_hollows:0 "Cheat: God of the Hollows"
 APL_cheat_god_of_the_hollows_desc:0 "+50% attack, defence, factory output and research."
 APL_cheat_mortal_again:0 "Cheat: Become Mortal Again"
 APL_cheat_mortal_again_desc:0 "Remove God of the Hollows."
 APL_lib_book_of_spruce_knob:0 "Annotate the Book of Spruce Knob"
 APL_lib_book_of_spruce_knob_desc:0 "The book Silas read from. Nobody has read past page forty and stayed sane. Research speed +5%."
 APL_lib_haint_blue_wards:0 "Haint Blue Wards"
 APL_lib_haint_blue_wards_desc:0 "Porch ceilings painted haint blue keep the restless dead away. Paint the ridge line. The Veil decays 0.25 slower."
 APL_lib_bone_scrying:0 "Bone Scrying"
 APL_lib_bone_scrying_desc:0 "Cast the knucklebones before every battle. Defence +5%."
 APL_lib_coal_seam_hymns:0 "Coal Seam Hymns"
 APL_lib_coal_seam_hymns_desc:0 "Miners sing to the seams, and the seams sing back. Factory output +5%."
 APL_lib_revenant_anatomy:0 "Revenant Anatomy"
 APL_lib_revenant_anatomy_desc:0 "What keeps the coal-camp dead walking? Organisation +5%."
 APL_lib_mothman_prophecies:0 "The Mothman Prophecies"
 APL_lib_mothman_prophecies_desc:0 "Write down everything the Mothman shows us. Research speed +5%."
 APL_lib_tithe_engines:0 "Tithe Engines"
 APL_lib_tithe_engines_desc:0 "Machines in the deep mines that run on prayer. +15 scrip a month."
 APL_lib_fog_cartography:0 "Fog Cartography"
 APL_lib_fog_cartography_desc:0 "Map the inside of the Veil. Veil cap +25, Veil +25."
 APL_lib_atomic_occultism:0 "Atomic Occultism"
 APL_lib_atomic_occultism_desc:0 "Dr. Varner's great work: uranium and old words. Research and factory output +5%."
 APL_lib_black_sun_rite:0 "The Black Sun Rite"
 APL_lib_black_sun_rite_desc:0 "A rite that needs a nuclear reactor and thirteen volunteers. Veil cap +50, Veil +50, organisation +5%."
 APL_lib_the_unwritten_name:0 "The Unwritten Name"
 APL_lib_the_unwritten_name_desc:0 "The name of the thing beneath the mountains. Stability +10%, defence +5%, research +5%."
