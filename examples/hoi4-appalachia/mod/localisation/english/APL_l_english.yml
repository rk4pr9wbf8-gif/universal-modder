 APL_court_the_coven:0 "Court the Coven"
 APL_court_the_coven_desc:0 "Gifts of blood and silver for the Thirteen."
 APL_court_the_assembly:0 "Court the Assembly"
 APL_court_the_assembly_desc:0 "Promises of roads, schools and safer mines."
 APL_purge_the_union_halls:0 "Purge the Union Halls"
 APL_purge_the_union_halls_desc:0 "The fog visits the union halls at night. Fewer men come back to the next meeting."
 APL_grant_the_miners_charter:0 "Grant the Miners' Charter"
 APL_grant_the_miners_charter_desc:0 "Eight-hour shifts, a company doctor and a seat at the table."
 APL_snake_handler_revival:0 "Snake-Handler Revival"
 APL_snake_handler_revival_desc:0 "Reverend Pike tours the hollows with his serpents. The faithful find their courage."
 APL_county_courthouse_elections:0 "County Courthouse Elections"
 APL_county_courthouse_elections_desc:0 "Let the counties elect their sheriffs and judges again."
 APL_call_a_council_moot:0 "Call a Council Moot"
 APL_call_a_council_moot_desc:0 "Summon the Thirteen and the Assembly to the Hollow Creek church."
 APL_moonshine_run:0 "Moonshine Run"
 APL_moonshine_run_desc:0 "Fast cars, back roads, and a trunk full of corn liquor for the cities outside."
 APL_company_scrip:0 "Print Company Scrip"
 APL_company_scrip_desc:0 "Political favours, paid out in paper."
 APL_coal_for_the_world:0 "Coal for the World"
 APL_coal_for_the_world_desc:0 "Our coal still burns, wherever it ends up. Sell it through middlemen."
 APL_sell_charms_abroad:0 "Sell Charms Abroad"
 APL_sell_charms_abroad_desc:0 "There are buyers for 1,000 Binding Charms in every capital, if nobody asks what they bind."
 APL_war_bonds_of_the_hollows:0 "War Bonds of the Hollows"
 APL_war_bonds_of_the_hollows_desc:0 "Every family buys a bond. Those who don't are remembered."
 APL_scrip_for_dollars:0 "Trade Scrip for Dollars"
 APL_scrip_for_dollars_desc:0 "Change scrip for hard currency through Swiss accounts."
 APL_dollars_for_scrip:0 "Trade Dollars for Scrip"
 APL_dollars_for_scrip_desc:0 "Turn the national treasury into Hollow Scrip."
 APL_whisper_to_moscow:0 "Whisper to Moscow"
 APL_whisper_to_moscow_desc:0 "The Soviets want to know what the fog is. Let them pay for hints."
 APL_bargain_with_washington:0 "Bargain with Washington"
 APL_bargain_with_washington_desc:0 "A quiet arrangement: Project Lantern goes dark for six months."
 APL_sell_the_sightings:0 "Sell the Sightings"
 APL_sell_the_sightings_desc:0 "Photographs of the Mothman sell for good money to the tabloids outside."
 APL_infiltrate_oak_ridge:0 "Infiltrate Oak Ridge"
 APL_infiltrate_oak_ridge_desc:0 "The physicists at Oak Ridge are just across the fog line. Some of them listen to the whispers."
 APL_sabotage_project_lantern:0 "Sabotage Project Lantern"
 APL_sabotage_project_lantern_desc:0 "Lantern's floodlights fail, one by one, all along the ridge."
 APL_haunt_the_kremlin:0 "Haunt the Kremlin"
 APL_haunt_the_kremlin_desc:0 "Something with red eyes walks the corridors of the Kremlin at night."
 APL_haunt_the_pentagon:0 "Haunt the Pentagon"
 APL_haunt_the_pentagon_desc:0 "The Pentagon has five sides. Now it has a sixth corridor that appears only after midnight."
 APL_recruit_defectors:0 "Recruit Defectors"
 APL_recruit_defectors_desc:0 "American deserters, Soviet spies and lost hikers: all of them can carry a rifle."
