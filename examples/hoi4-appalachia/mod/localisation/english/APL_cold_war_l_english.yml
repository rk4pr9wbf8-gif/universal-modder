 APL_CW_APL_DESC:0 "Behind a mile-high wall of fog, the hollows have broken away from the United States. Nobody outside knows what the Coven did on Spruce Knob, and nobody who went in to find out has come back the same."
 APL_CW_USA_DESC:0 "The sole atomic power, for now. Truman has contained Moscow in Europe; he has not yet noticed that the middle of his own country has vanished into the fog."
 APL_CW_SOV_DESC:0 "Stalin's empire stretches from the Elbe to the Pacific. The Soviet bomb is three months away. Moscow's scientists are very interested in the Appalachian fog."
 APL_CW_ENG_DESC:0 "Victorious and bankrupt. Attlee's Britain is building a welfare state at home while its empire slips away."
 APL_CW_FRA_DESC:0 "The Fourth Republic is rebuilding while fighting a war it can't win in Indochina."
 APL_CW_PRC_DESC:0 "The People's Liberation Army has crossed the Yangtze. Nanjing and Shanghai have fallen. Mao will soon proclaim a new China."
 APL_CW_CHI_DESC:0 "The Nationalists are falling back to the south, the west and Taiwan. Chiang Kai-shek is preparing a last stand."
 APL_CW_WGR_DESC:0 "The Federal Republic is founded today. The occupation goes on, but Germany is a democracy again."
 APL_CW_DDR_DESC:0 "The Soviet zone is becoming a socialist state of its own."
 APL_CW_ITA_DESC:0 "De Gasperi's Christian Democrats have kept Italy in the West, narrowly."
 APL_CW_YUG_DESC:0 "Tito has broken with Stalin and survived. Yugoslavia stands alone between the blocs."
 APL_CW_KOR_DESC:0 "Syngman Rhee rules south of the 38th parallel, and claims everything north of it."
 APL_CW_PRK_DESC:0 "Kim Il-sung rules north of the 38th parallel, and claims everything south of it."
 APL_CW_RAJ_DESC:0 "Two years free. Nehru's India is choosing its own path between Washington and Moscow."
 APL_CW_ISR_DESC:0 "The war of independence has just ended in armistices. The new state has survived its first year."
 APL_CW_JAP_DESC:0 "Occupied by the Americans, demilitarised and rebuilding."
 APL_CW_POL_DESC:0 "Moved two hundred miles west and ruled from Moscow."
 APL_CW_OTHER_DESC:0 "The Iron Curtain has fallen across Europe, and something else has fallen across Appalachia."
